<div class="backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 class="modal-title" id="modal-title">{{ 'Edit task' if task_id else 'New task' }}</h2>

    <form {% if task_id %}hx-put="/tasks/{{ task_id }}?{{ qs }}"{% else %}hx-post="/tasks?{{ qs }}"{% endif %}
          hx-target="#task-list" hx-swap="outerHTML">
      <label class="label" for="task-title">Task</label>
      <input class="input" id="task-title" name="title" type="text"
             value="{{ title }}" maxlength="255" autocomplete="off"
             placeholder="Write it short and concrete" autofocus required>

      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

      <div class="modal-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>
